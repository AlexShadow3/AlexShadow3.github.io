<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Générateur de QR Codes - AlexShadow3</title>
    <link href="../images/Meliodas.png" rel="icon" />
    <link href="qrcode.css" rel="stylesheet">
    <script src="../index.js" type="module" defer></script>
</head>
<body>
    <header class="primary-header">
        <nav class="navbar container">
            <a href="../index.html" class="logo">ALEXSHADOW3</a>
            <ul class="nav-list">
                <li>
                    <a href="../my_game/You are the last of them/index.html" class="nav-link lang" key="NAV_MY_GAME">Mon jeu</a>
                </li>
                <li>
                    <a href="qrcode.html" class="nav-link active lang" key="NAV_QR_CODES">QR Codes</a>
                </li>
                <li>
                    <a href="../heist-bot/conditions.html" class="nav-link lang" key="NAV_HEIST_TOS">Heist Bot CGU</a>
                </li>
                <li>
                    <a href="../heist-bot/confidentialite.html" class="nav-link lang" key="NAV_HEIST_PRIVACY">Heist Bot Confidentialité</a>
                </li>
            </ul>
            <div class="translate-buttons">
                <button class="translate" id="fr-fr">Français</button>
                <button class="translate" id="en-gb">English</button>
            </div>
        </nav>
    </header>

    <main class="main-content">
        <section class="qr-card">
            <h1 class="lang" key="QR_TITLE">Générateur QR</h1>
            <p class="subtitle lang" key="QR_SUBTITLE">Créez instantanément un code QR à partir de n'importe quel texte ou lien.</p>

            <div class="input-group">
                <input type="text" class="qr_texte" placeholder="Ex: https://alexshadow3.github.io" autofocus>
            </div>

            <div class="qr_code"></div>

            <div class="action-buttons" style="display: none;">
                <button id="copy-btn" class="action-btn">
                    <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none"
                        stroke-linecap="round" stroke-linejoin="round">
                        <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                        <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                    </svg>
                    <span class="lang" key="QR_BTN_COPY">Copier</span>
                </button>
                <button id="download-btn" class="action-btn">
                    <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                        <polyline points="7 10 12 15 17 10"></polyline>
                        <line x1="12" y1="15" x2="12" y2="3"></line>
                    </svg>
                    <span class="lang" key="QR_BTN_DOWNLOAD">Télécharger</span>
                </button>
            </div>
        </section>
    </main>

    <footer>
        <p>© 2026 AlexShadow3</p>
    </footer>

    <!-- JavaScript Code-->
    <script src="qrcode.min.js"></script>
    <script type="module">
        import { translations } from '../translations.js';
        
        const qr_texte = document.querySelector(".qr_texte");
        const qrcodeContainer = document.querySelector(".qr_code");
        const actionButtons = document.querySelector(".action-buttons");
        const copyBtn = document.getElementById("copy-btn");
        const downloadBtn = document.getElementById("download-btn");
        let debounceTimer;

        function generateur() {
            const text = qr_texte.value.trim();
            qrcodeContainer.innerHTML = "";

            if (text !== "") {
                qrcodeContainer.style.display = "flex";
                actionButtons.style.display = "flex";
                new QRCode(qrcodeContainer, {
                    text: text,
                    width: 200,
                    height: 200,
                    colorDark: "#000000",
                    colorLight: "#ffffff",
                    correctLevel: QRCode.CorrectLevel.H
                });
            } else {
                qrcodeContainer.style.display = "none";
                actionButtons.style.display = "none";
            }
        }

        // Generate on typing with debounce for better UX
        qr_texte.addEventListener('input', () => {
            clearTimeout(debounceTimer);
            debounceTimer = setTimeout(generateur, 150);
        });

        // Fonction pour télécharger
        downloadBtn.addEventListener('click', () => {
            const canvas = qrcodeContainer.querySelector('canvas');
            if (canvas) {
                const url = canvas.toDataURL("image/png");
                const link = document.createElement('a');
                link.download = 'qrcode.png';
                link.href = url;
                link.click();
            }
        });

        // Fonction pour copier
        copyBtn.addEventListener('click', async () => {
            const canvas = qrcodeContainer.querySelector('canvas');
            if (canvas) {
                canvas.toBlob(async (blob) => {
                    try {
                        const item = new ClipboardItem({ "image/png": blob });
                        await navigator.clipboard.write([item]);

                        // Feedback visuel
                        const originalText = copyBtn.innerHTML;
                        const lang = window.currentLanguage || localStorage.getItem('preferredLang') || 'fr-fr';
                        const copiedText = translations[lang]['QR_COPIED'];
                        
                        copyBtn.innerHTML = '<svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg> ' + copiedText;
                        copyBtn.classList.add('success');
                        setTimeout(() => {
                            copyBtn.innerHTML = originalText;
                            copyBtn.classList.remove('success');
                        }, 2000);
                    } catch (error) {
                        console.error('Échec de la copie', error);
                        const lang = window.currentLanguage || localStorage.getItem('preferredLang') || 'fr-fr';
                        alert(translations[lang]['QR_COPY_ERROR']);
                    }
                });
            }
        });
    </script>
</body>
</html>
